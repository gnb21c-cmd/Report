# 네이버 예약 자동 수집 — 매일 아침 9시 15분(한국 시간) POS 메인 PC(실행기 nice-pos)에서 어제 예약현황을 읽어 A 네이버 칸을 채움
# 판매입장권 = 이용완료 (평일 무제한 · 야간자유 입장), 신규방문자 = 어제 목록에 나온 줄 수 = '완료 N' 인 손님. apps/collector/src/naver.ts · packages/core/src/naverAuto.ts
# 어제 + 지난 7일 중 네이버 칸이 빈 날 · 사람이 A 에서 넣은 칸은 그대로
# 로그인은 POS 메인 PC에서 사람이 한 번 해 둔 상태(실행기 도구 폴더의 naver-login\state.json) — 풀리면 C:\actions-runner\naver-login.cmd 로 다시
# 공개 저장소라 기록에는 칸 수 · 같음/다름만 남김 (인원 숫자 · 이름 · 사업장 번호 없음)
name: 네이버 예약 자동 수집
on:
  schedule:
    - cron: "15 0 * * *" # 00:15 UTC = 09:15 한국 (문 열기 전 — '완료 N' 이 바뀌기 전에)
    # 안 됐으면 10분 뒤 한 번 더 (첫 실행이 성공했으면 건너뜀)
    - cron: "25 0 * * *" # 00:25 UTC = 09:25 한국
    # 그래도 안 됐으면 10시대에 두 번 더 (어제 온 손님이 다음 날 아침에 또 오는 일은 없어 문 연 뒤에도 '완료 N' 이 그대로) — 10시 반 전에
    - cron: "0 1 * * *" # 01:00 UTC = 10:00 한국
    - cron: "12 1 * * *" # 01:12 UTC = 10:12 한국
  # 작업 브랜치에 올리면 POS 메인 PC에서 최근 며칠을 읽어 사람이 넣은 값과 견주기만 (올리지 않음)
  push:
    branches: ["feature/naver-collect", "feature/naver-retry", "feature/naver-ask"]
    paths: ["apps/collector/**", "packages/core/src/naverAuto.ts", ".github/workflows/naver-collect.yml"]
  workflow_dispatch:
    inputs:
      date:
        description: "시작 날짜 (YYYY-MM-DD, 비우면 어제 + 지난 7일 중 빈 날)"
        required: false
      to:
        description: "끝 날짜 (YYYY-MM-DD, 비우면 시작 날짜 하루)"
        required: false
      dry:
        description: "확인만 (올리지 않음, 사람이 넣은 값과 견줌)"
        type: boolean
        default: false
      ask:
        description: "A [신규 다시 확인] 요청 시각 (naver-ask.yml 이 넣음 — 사람은 비워 둠)"
        required: false
concurrency:
  group: naver-collect
  cancel-in-progress: false
jobs:
  # 다시 하는 예약(09:25 · 10:00 · 10:12)이면: 오늘 아침 예약 실행이 이미 성공했는지 보고, 성공했으면 건너뜀
  # 신규방문자를 다 못 읽은 실행은 실패로 끝나므로 다시 함
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      done: ${{ steps.c.outputs.done }}
    steps:
      - id: c
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== "schedule" || !["25 0 * * *", "0 1 * * *", "12 1 * * *"].includes(context.payload.schedule)) return core.setOutput("done", "");
            const day = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
            const r = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: "naver-collect.yml", event: "schedule", status: "success", created: `>=${day}T00:00:00+09:00` });
            const ok = r.data.workflow_runs.some((x) => x.id !== context.runId);
            core.info(ok ? "오늘 아침 실행이 이미 성공 — 건너뜀" : "오늘 아침 실행이 안 됐거나 실패 — 다시 함");
            core.setOutput("done", ok ? "1" : "");
  collect:
    needs: check
    if: needs.check.outputs.done != '1'
    runs-on: [self-hosted, Windows, nice-pos]
    timeout-minutes: 40
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.tool_cache }}\setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @report/collector exec playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}\ms-playwright
      - name: 네이버 → 클라우드
        run: pnpm --filter @report/collector naver
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}\ms-playwright
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          # 로그인 상태 · 로그인 창(naver-login.cmd)을 두는 곳 — 실행할 때마다 지워지지 않는 도구 폴더
          NAVER_STATE_DIR: ${{ runner.tool_cache }}\naver-login
          NAVER_BIZ_ID: ${{ secrets.NAVER_BIZ_ID }}
          COLLECT_FROM: ${{ inputs.date }}
          NAVER_ASK: ${{ inputs.ask }}
          COLLECT_TO: ${{ inputs.to }}
          COLLECT_DRY: ${{ (github.event_name == 'push' || inputs.dry) && '1' || '' }}
          NAVER_PROBE: ${{ github.event_name == 'push' && '1' || '' }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          REPORT_BOARD_KEY: ${{ secrets.REPORT_BOARD_KEY }}
          WEATHER_EMAIL: ${{ secrets.WEATHER_EMAIL }}
          WEATHER_PASSWORD: ${{ secrets.WEATHER_PASSWORD }}
