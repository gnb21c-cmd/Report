# 베이커리 작업지시 계획 — apps/collector/src/plan.ts (규칙은 packages/core/src/bakery.ts)
#   목요일 새벽 00:47 · 02:17 · 03:47 · 05:17 (늦으면 06:41): 다음 주 월 ~ 일 주간 잠정안 (매니저 앱에는 아침 6시부터 보임 · 수요일 실적은 아직 없어 화요일까지로 셈)
#   매일 15시: 3일 뒤 최종안 (아침 09:10 수집한 어제까지 실적의 오차를 보정). 목요일 15시에는 주간안을 다시 세지 않음 — 새벽 계산이 빠졌을 때만 만듦
# 필요한 값: Variables FIREBASE_API_KEY · FIREBASE_PROJECT_ID, Secrets REPORT_BOARD_KEY · WEATHER_EMAIL · WEATHER_PASSWORD
# 공개 저장소라 기록에는 날짜 · 빵 종류 수만. GitHub 예약 실행은 10~20분 늦게 시작하거나 건너뛸 수 있어 14:35 · 15:20 두 번 걸어 둠
name: 베이커리 계획
on:
  schedule:
    # 목요일 새벽 — 주간 잠정안만 (UTC 로는 수요일). 매니저 앱에는 6시부터 보이니 일찍 셈
    # GitHub 예약은 몇 시간 늦거나 건너뛸 때가 있어(밤 예약이 5시간 늦은 적 있음) 여러 번 걸어 둠 — 오늘 이미 셌으면 건너뜀
    - cron: "47 15 * * 3" # 수 15:47 UTC = 목 00:47 한국
    - cron: "17 17 * * 3" # 수 17:17 UTC = 목 02:17 한국
    - cron: "47 18 * * 3" # 수 18:47 UTC = 목 03:47 한국
    - cron: "17 20 * * 3" # 수 20:17 UTC = 목 05:17 한국
    - cron: "41 21 * * 3" # 수 21:41 UTC = 목 06:41 한국 — 앞의 네 번이 다 늦거나 빠졌을 때만
    - cron: "35 5 * * *" # 05:35 UTC = 14:35 한국
    # GitHub 예약 실행은 가끔 늦거나 건너뜀 → 한 번 더. 같은 자료로 다시 세면 같은 결과라 두 번 돌아도 숫자는 그대로
    - cron: "20 6 * * *" # 06:20 UTC = 15:20 한국
  # 작업 브랜치에 올리면 다가오는 목요일로 확인만 (쓰지 않음)
  push:
    branches: ["feature/bakery-weekly"]
    paths: ["apps/collector/src/plan.ts", "packages/core/src/bakery.ts", "packages/core/src/forecast.ts", ".github/workflows/bakery-plan.yml"]
  workflow_dispatch:
    inputs:
      today:
        description: "이 날인 것처럼 (YYYY-MM-DD, 비우면 오늘)"
        required: false
      dry:
        description: "확인만 (쓰지 않음)"
        type: boolean
        default: false
      week_only:
        description: "주간 잠정안만 (목요일 새벽 계산처럼)"
        type: boolean
        default: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 다가오는 목요일 (작업 브랜치 시험용)
        id: when
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            d=$(TZ=Asia/Seoul date +%F); while [ "$(date -d "$d" +%u)" != "4" ]; do d=$(date -d "$d +1 day" +%F); done
            echo "today=$d" >> "$GITHUB_OUTPUT"; echo "dry=1" >> "$GITHUB_OUTPUT"
          else
            echo "today=${{ inputs.today }}" >> "$GITHUB_OUTPUT"; echo "dry=${{ inputs.dry == true && '1' || '' }}" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm --filter @report/collector plan
        env:
          PLAN_TODAY: ${{ steps.when.outputs.today }}
          PLAN_DRY: ${{ steps.when.outputs.dry }}
          # 목요일 새벽 예약(UTC 수요일, '* * 3'으로 끝남) · 직접 실행의 '주간 잠정안만' → 주간안만 셈
          PLAN_MODE: ${{ ((github.event_name == 'schedule' && endsWith(github.event.schedule, '* * 3')) || inputs.week_only == true) && 'week' || '' }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          REPORT_BOARD_KEY: ${{ secrets.REPORT_BOARD_KEY }}
          WEATHER_EMAIL: ${{ secrets.WEATHER_EMAIL }}
          WEATHER_PASSWORD: ${{ secrets.WEATHER_PASSWORD }}
