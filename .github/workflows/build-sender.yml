# 매장 POS 매출 보내기(A) 설치 묶음 만들기 — apps/sender
# GitHub → Actions → "Build sender" → Run workflow → 끝나면 Artifacts 에서 pos-report-sender 내려받기
# 32비트로 만듦: OK포스 Firebird 클라이언트(fbclient.dll)가 32비트라서 (64비트 Windows 에서도 돎)
name: Build sender
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths: ["apps/sender/**", ".github/workflows/build-sender.yml"]
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/sender
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x86
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt "pyinstaller>=6.3,<7"
      - name: 시험
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: exe 만들기 (32비트)
        run: |
          pyinstaller --noconfirm --onefile --console --name PosReport --paths src --hidden-import xlrd --hidden-import fdb --collect-submodules fdb src/console_main.py
          pyinstaller --noconfirm --onefile --noconsole --name PosReportW --paths src --hidden-import xlrd --hidden-import fdb --collect-submodules fdb src/window_main.py
      - name: 묶기 · 실행 확인
        shell: pwsh
        run: |
          $out = "out/PosReport"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item dist/PosReport.exe, dist/PosReportW.exe $out
          Copy-Item windows/* $out
          # 보관함 주소(비밀 아님)를 묶음에 넣어 두면 설치 때 묻지 않음 — 저장소 변수 FIREBASE_API_KEY · FIREBASE_PROJECT_ID
          if ("${{ vars.FIREBASE_PROJECT_ID }}") {
            [IO.File]::WriteAllText("$PWD/$out/firebase.json", '{"apiKey":"${{ vars.FIREBASE_API_KEY }}","projectId":"${{ vars.FIREBASE_PROJECT_ID }}","board":"${{ secrets.REPORT_BOARD_KEY }}","kmaKey":"${{ secrets.KMA_SERVICE_KEY }}"}')
          }
          $v = & "$out/PosReport.exe" version
          Write-Host "version: $v"
          $env:POS_REPORT_HOME = "$env:RUNNER_TEMP/posreport"
          & "$out/PosReport.exe" setup --pos cafe --apikey x --projectid x --email ci@example.invalid --password x --board ci-board-key-0000 --folder "$env:RUNNER_TEMP/xls"
          if ($LASTEXITCODE -ne 0) { throw "setup 실패" }
          & "$out/PosReport.exe" check   # 가짜 계정이라 [확인 필요]가 나오는 것이 정상 — 실행만 확인
          if (-not (Test-Path "$env:POS_REPORT_HOME/logs/send.log")) { throw "기록 파일이 없습니다" }
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pos-report-sender
          path: apps/sender/out/PosReport/
