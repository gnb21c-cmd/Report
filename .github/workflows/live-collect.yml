# 오늘 마감 전 영업정보 — POS 메인 PC(바리스타 POS, 실행기 nice-pos)가 아침에 한 번 시작해 22:50 까지 켜져 있으면서
# 자기 시계로 매시 0 · 15 · 30 · 45분(한국 10:00 ~ 22:45)에 바로 받음 (2026-10-19 사장님 — apps/collector/src/liveLoop.ts)
# OKPOS 점주 웹의 오늘 카페 · 키즈 영수증별 엑셀 → 확정 보고와 같은 계산 → 클라우드 live/{오늘} → 보고 앱 B '마감 전 영업정보'
# + 네이버 예약현황(오늘)의 30분 칸별 이용완료 + 확정(입장예정) 장수 → live/{오늘}.naver (키즈 입장료 계산)
# apps/collector/src/live.ts · 규칙은 packages/core/src/live.ts. 확정 칸(reports)은 그대로 — 다음 날 아침 09:12 확정 수집
# GitHub 예약 실행은 20분 남짓 늦거나 자주 건너뛰어(15분마다로 바꾼 날 3시간에 3번) 예약은 '시작'만 맡김
#   09:30 · 09:45 · 10:00 부터 30분마다 시작을 시도하고, 이미 돌고 있으면 바로 건너뜀
#   PC 를 다시 켰거나 아침 시작이 빠졌으면 다음 시도 때 시작해 놓친 칸(15분 안)을 바로 받음
# 실행기가 하나라 도는 동안 다른 일은 기다림 → 칸 사이 1분마다 보고, 기다리는 일이 있으면 자기를 다시 시작시켜 두고 비켜 줌 (아침 네이버 다시 하기 · 손으로 시작한 수집)
#   A [신규 다시 확인] 요청도 칸 사이 1분마다 보고 여기서 바로 함 (naver-ask.yml 은 하루 수집이 안 돌 때를 맡음)
# GitHub 클라우드에서는 돌리지 않음 (사용자 지시 — POS 에서만). POS PC 가 꺼져 있으면 켜질 때까지 기다렸다가 돎(그날 영수증이 없으면 올리지 않음)
# + 칸마다 통합데스크 설문 보고 파일(report-outbox, 20:00) → settings/surveys (보고 앱 첫 화면 '설문조사') — 같은 PC 일 때만. 통합데스크는 키즈 POS 라 클라우드 설문 보고함(surveyInbox)에 바로 씀 (docs/SURVEY.md)
# 공개 저장소라 기록에는 줄 수 · 일치 여부 · 시각만 (매출 숫자 · 매장 이름 없음)
name: 오늘 마감 전 영업정보
on:
  schedule:
    # 하루 수집 시작 — 10:00 첫 칸 전에 (아침 확정 수집 09:10 ~ 09:25 가 늦게 돌고 있으면 그 뒤에)
    - cron: "30,45 0 * * *" # 00:30 · 00:45 UTC = 09:30 · 09:45 한국
    # 안 돌고 있으면 다시 시작 (아침 시작이 빠졌거나 · PC 를 다시 켰거나 · 멈췄을 때) — 돌고 있으면 바로 건너뜀
    - cron: "0,30 1-13 * * *" # 01:00 ~ 13:30 UTC = 10:00 ~ 22:30 한국, 30분마다
  # 작업 브랜치에 올리면 POS 메인 PC 에서 오늘 날짜로 한 번 확인만 (올리지 않음)
  push:
    branches: ["feature/live-today", "feature/live-fix", "feature/live-naver"]
    paths: ["apps/collector/src/live.ts", "apps/collector/src/okpos.ts", "apps/collector/src/naverBook.ts", "packages/core/src/live.ts", ".github/workflows/live-collect.yml"]
  workflow_dispatch:
    inputs:
      date:
        description: "날짜를 넣으면 그 날짜를 한 번만 받음 (YYYY-MM-DD 또는 yesterday — 시험용, 비우면 하루 수집)"
        required: false
      once:
        description: "하루 수집 대신 지금 한 번만 받기"
        type: boolean
        default: false
      dry:
        description: "확인만 (올리지 않음)"
        type: boolean
        default: false
      end:
        description: "끝 시각 HH:MM (비우면 22:50 — 시험용)"
        required: false
jobs:
  # 예약으로 시작했을 때: 하루 수집이 이미 돌고 있거나(시작을 기다리는 것 포함) · 하루 수집 시간이 아니면 건너뜀
  # 손으로 시작 · 비켜 준 뒤 다시 시작은 그대로 (겹치면 아래 concurrency 로 앞의 것이 끝난 뒤에)
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== "schedule") return core.setOutput("go", "1");
            const hm = new Date(Date.now() + 9 * 3600e3).toISOString().slice(11, 16);
            if (hm >= "22:40" || hm < "09:00") {
              core.info("하루 수집 시간이 아님 — 건너뜀");
              return core.setOutput("go", "");
            }
            for (const status of ["in_progress", "queued", "waiting", "pending"]) {
              const r = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: "live-collect.yml", status, per_page: 30 });
              for (const run of r.data.workflow_runs) {
                if (run.id === context.runId) continue;
                const j = await github.rest.actions.listJobsForWorkflowRun({ ...context.repo, run_id: run.id, filter: "latest" });
                if (j.data.jobs.some((x) => x.name === "하루 수집" && x.status !== "completed")) {
                  core.info("하루 수집이 이미 돌고 있음 — 건너뜀");
                  return core.setOutput("go", "");
                }
              }
            }
            core.info("하루 수집이 안 돌고 있음 — 시작");
            core.setOutput("go", "1");
  live:
    name: 하루 수집
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: [self-hosted, Windows, nice-pos]
    # 09:30 에 시작하면 22:50 까지 800분 + 준비
    timeout-minutes: 840
    permissions:
      contents: read
      # 기다리는 다른 일 보기 · 비켜 주기 전에 자기를 다시 시작
      actions: write
    # 하루 수집은 하나만 — 겹치면 앞의 것이 끝난 뒤에 (기다리는 것은 가장 새것 하나만)
    concurrency:
      group: live-loop
      cancel-in-progress: false
    # POS PC 는 PowerShell 스크립트가 막혀 있어(실행 정책) cmd 로
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      # 실행기 도구 폴더에 설치 — 기본값(사용자 폴더)이면 공개 기록에 PC 사용자 이름이 찍힘
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.tool_cache }}\setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 받은 꾸러미를 실행기 도구 폴더에 쌓아 두고 다시 씀 — 매번 1분 넘게 새로 받으면 영업 중 POS PC 에 부담
      - run: pnpm install --frozen-lockfile --store-dir "${{ runner.tool_cache }}\pnpm-store"
      # 크롬은 한 번 받아 두고 다시 씀 (실행기 도구 폴더)
      - run: pnpm --filter @report/collector exec playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}\ms-playwright
      # 22:50 까지 이 단계가 계속 돎 — 칸마다 OKPOS 오늘 → 클라우드 live (live.ts) · 통합데스크 설문 파일 → 클라우드 (survey.ts, 폴더가 없으면 건너뜀)
      - name: 마감 전 영업정보 — 매시 0 · 15 · 30 · 45분
        run: pnpm --filter @report/collector live-loop
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}\ms-playwright
          # 임시 파일도 실행기 폴더에 (오류 글에 사용자 폴더 이름이 찍히지 않게)
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          LIVE_DATE: ${{ inputs.date }}
          LOOP_ONCE: ${{ (github.event_name == 'push' || inputs.once || inputs.date != '') && '1' || '' }}
          LOOP_END: ${{ inputs.end }}
          COLLECT_DRY: ${{ (github.event_name == 'push' || inputs.dry) && '1' || '' }}
          GH_TOKEN: ${{ github.token }}
          # 네이버 예약현황 (오늘) · A [신규 다시 확인] — 로그인 상태는 아침 네이버 수집과 같은 곳 (POS 메인 PC 도구 폴더)
          NAVER_STATE_DIR: ${{ runner.tool_cache }}\naver-login
          NAVER_BIZ_ID: ${{ secrets.NAVER_BIZ_ID }}
          OKPOS_ID: ${{ secrets.OKPOS_ID }}
          OKPOS_PW: ${{ secrets.OKPOS_PW }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          REPORT_BOARD_KEY: ${{ secrets.REPORT_BOARD_KEY }}
          WEATHER_EMAIL: ${{ secrets.WEATHER_EMAIL }}
          WEATHER_PASSWORD: ${{ secrets.WEATHER_PASSWORD }}
