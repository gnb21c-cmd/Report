# 키즈 요금제 검증 (손으로 실행) — apps/collector/src/feeStudy.ts
# 2026-04-01 교환권 → 입장료 전환 전 · 후 작년 대비 흐름의 차이(이중 차이), 평일 · 휴일 · 기간 스티커 · 달마다
# 공개 저장소라 기록에는 % · 비율 · 날 수만 (매출 금액 · 손님 수 없음)
name: 키즈 요금제 검증
# 2026-10-13 첫 결과: 총매출 이중 차이 평일 −0.4% · 휴일 −0.8% (변화 없음) · 휴일 키즈 장수 −12.3% · 휴일 1장당 총매출 +13.1% ·
#   휴일 카페 매출 −15.1% · 교환권 시절 판 교환권의 98 ~ 100% 를 카페에서 씀 (카페 매출의 29 ~ 32%) · 입장료 시절 키즈 몫 10.4%
on:
  workflow_dispatch:
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @report/collector fee-study
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          REPORT_BOARD_KEY: ${{ secrets.REPORT_BOARD_KEY }}
