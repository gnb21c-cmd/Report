# 사무실 PC (C) 설치 묶음 만들기 — apps/office + A · B 화면(HTML 한 장씩)을 exe 안에 넣음
# GitHub → Actions → "Build office" → Run workflow → 끝나면 Artifacts 에서 pos-report-office 내려받기
# 묶음: PosReport.exe(설치·점검) · PosReportC.exe(창 없이 늘 도는 서버) · install-c.bat · install-a.bat · 읽어주세요.txt
name: Build office
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths: ["apps/office/**", "apps/entry/**", "apps/view/**", "packages/core/**", ".github/workflows/build-office.yml"]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: A · B 화면 만들기
        run: pnpm build:web
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x86
      - name: 시험
        working-directory: apps/office
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: exe 만들기 (32비트 — 오래된 PC 에서도 돎)
        working-directory: apps/office
        run: |
          pip install "pyinstaller>=6.3,<7"
          pyinstaller --noconfirm --onefile --console --name PosReport --paths src --add-data "web;web" src/console_main.py
          pyinstaller --noconfirm --onefile --noconsole --name PosReportC --paths src --add-data "web;web" src/server_main.py
      - name: 묶기 · 실행 확인
        working-directory: apps/office
        shell: pwsh
        run: |
          $out = "out/PosReport"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item dist/PosReport.exe, dist/PosReportC.exe $out
          Copy-Item windows/* $out
          # 보관함 주소(비밀 아님)를 묶음에 넣어 두면 설치 때 묻지 않음 — 저장소 변수 FIREBASE_API_KEY · FIREBASE_PROJECT_ID
          if ("${{ vars.FIREBASE_PROJECT_ID }}") {
            [IO.File]::WriteAllText("$PWD/$out/firebase.json", '{"apiKey":"${{ vars.FIREBASE_API_KEY }}","projectId":"${{ vars.FIREBASE_PROJECT_ID }}","board":"${{ secrets.REPORT_BOARD_KEY }}","kmaKey":"${{ secrets.KMA_SERVICE_KEY }}"}')
          }
          $v = & "$out/PosReport.exe" version
          Write-Host "version: $v"
          $env:POS_REPORT_HOME = "$env:RUNNER_TEMP/posreport"
          & "$out/PosReport.exe" setup --port 8790 --name "CI"
          if ($LASTEXITCODE -ne 0) { throw "setup 실패" }
          & "$out/PosReport.exe" check   # 시험 모드 · 날씨 없음 — 실행만 확인
          $p = Start-Process -FilePath "$out/PosReportC.exe" -ArgumentList "serve" -PassThru
          Start-Sleep -Seconds 6
          $info = Invoke-RestMethod -Uri "http://localhost:8790/api/info" -TimeoutSec 10
          Write-Host ("C 응답: " + $info.name + " " + $info.version + " trial=" + $info.trial)
          $page = Invoke-WebRequest -Uri "http://localhost:8790/" -UseBasicParsing -TimeoutSec 10
          if ($page.Content -notmatch "매출 보고 입력") { throw "A 화면이 안 나옴" }
          $b = Invoke-WebRequest -Uri "http://localhost:8790/b/" -UseBasicParsing -TimeoutSec 10
          if ($b.Content -notmatch "매출 보고") { throw "B 화면이 안 나옴" }
          Stop-Process -Id $p.Id -Force
          if (-not (Test-Path "$env:POS_REPORT_HOME/logs/office.log")) { throw "기록 파일이 없습니다" }
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pos-report-office
          path: apps/office/out/PosReport/
