# POS 상주 전송기(마감 전 영업정보) 시험 — POS 메인 PC(실행기 nice-pos)에서만, 확인만 (올리지 않음)
# GitHub 클라우드에서는 돌리지 않음 (해외 접속 차단 — 사용자 지시 10/8). POS 는 아침 9시쯤 켜짐
# 시험용 브랜치(feature/v2-live-test)에 올릴 때만 돎 — 작업 브랜치(feature/v2-integration)에 올려도 돌지 않음
# 아침 수집 시간(08:30 ~ 10:30)에는 POS 실행기를 차지하지 않게 시작하지 않음
# 시험: 오늘 날짜로 3분마다 3번 — 로그인을 한 번만 하고 세션을 이어 쓰는지 · 엑셀 합계 · 검사 / 어제 날짜로 1번 — 하루 전체 엑셀
# 실제 설치는 작업 스케줄러(apps/collector/pos-live, 마감 전 전송기 설치) — main 에 올린 뒤
# 공개 저장소라 기록에는 줄 수 · 일치 여부 · 로그인 횟수만
name: POS 전송기 시험
on:
  push:
    branches: ["feature/v2-live-test"]
concurrency:
  group: naver-collect
  cancel-in-progress: false
jobs:
  when:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.t.outputs.ok }}
    steps:
      - id: t
        run: |
          hm=$(TZ=Asia/Seoul date +%H%M)
          if [ "$hm" -ge 0830 ] && [ "$hm" -lt 1030 ]; then echo "아침 수집 시간이라 시작하지 않음"; echo "ok=" >> "$GITHUB_OUTPUT"; else echo "ok=1" >> "$GITHUB_OUTPUT"; fi
  live:
    needs: when
    if: needs.when.outputs.ok == '1'
    runs-on: [self-hosted, Windows, nice-pos]
    timeout-minutes: 30
    # POS PC 는 PowerShell 스크립트가 막혀 있어(실행 정책) 네이버 수집처럼 cmd 로
    defaults:
      run:
        shell: cmd
    env:
      COLLECT_DRY: "1"
      OKPOS_ID: ${{ secrets.OKPOS_ID }}
      OKPOS_PW: ${{ secrets.OKPOS_PW }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      REPORT_BOARD_KEY: ${{ secrets.REPORT_BOARD_KEY }}
      WEATHER_EMAIL: ${{ secrets.WEATHER_EMAIL }}
      WEATHER_PASSWORD: ${{ secrets.WEATHER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.tool_cache }}\setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @report/collector exec playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}\ms-playwright
      - name: 오늘 날짜로 3분마다 3번 (확인만)
        run: pnpm --filter @report/collector live
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}\ms-playwright
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          LIVE_CYCLES: "3"
          LIVE_EVERY: "3"
      - name: 어제 날짜로 1번 (확인만 — 하루 전체 엑셀)
        run: pnpm --filter @report/collector live
        env:
          LIVE_DATE: yesterday
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}\ms-playwright
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          LIVE_CYCLES: "1"
