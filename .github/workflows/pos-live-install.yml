# 마감 전 전송기 설치(준비) — POS 메인 PC(실행기 nice-pos)의 도구 폴더에 앱 · 크롬 · 암호화한 비밀값을 깔아 둠
# 작업 스케줄러 등록은 관리자 권한이 필요해(실행기는 권한이 낮은 NETWORK SERVICE) 사람이 POS 에서 한 번:
#   C:\actions-runner\pos-live-install.cmd 를 마우스 오른쪽 → 관리자 권한으로 실행
# 비밀값은 Windows 암호화(이 PC 에서만 풀림, LocalMachine)로 secrets.bin 에만 — 기록 · 저장소에 남지 않음
# main 에 올린 뒤에만 쓸 수 있음 (Actions → 마감 전 전송기 설치 → Run workflow)
name: 마감 전 전송기 설치
on:
  workflow_dispatch:
concurrency:
  group: naver-collect
  cancel-in-progress: false
jobs:
  stage:
    runs-on: [self-hosted, Windows, nice-pos]
    timeout-minutes: 30
    # POS PC 는 PowerShell 스크립트가 막혀 있어(실행 정책) cmd 로, 깔기 스크립트만 이번 실행에서 정책을 건너뜀
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.tool_cache }}\setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @report/collector exec playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}\pos-live\ms-playwright
      - name: 도구 폴더에 깔기
        env:
          DEST: ${{ runner.tool_cache }}\pos-live
          OKPOS_ID: ${{ secrets.OKPOS_ID }}
          OKPOS_PW: ${{ secrets.OKPOS_PW }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          REPORT_BOARD_KEY: ${{ secrets.REPORT_BOARD_KEY }}
          WEATHER_EMAIL: ${{ secrets.WEATHER_EMAIL }}
          WEATHER_PASSWORD: ${{ secrets.WEATHER_PASSWORD }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps\collector\pos-live\stage.ps1
