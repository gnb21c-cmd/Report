# 1주 단위 빵 수량 시험 (손으로 실행) — apps/collector/src/weekStudy.ts
# 작년 대비 비율이 고른지 · 주 총 개수 예측 · 요일 몫으로 나눈 하루 오차 · 손님이 같은 주 다른 날로 옮겨 가는지
# 공개 저장소라 기록에는 % · 상관 · 날 수 · 주 수만 (판매 개수 · 손님 수 · 매출 없음)
name: 1주 단위 시험
on:
  push:
    branches: ["feature/bakery-step"]
    paths: ["apps/collector/src/weekStudy.ts", ".github/workflows/week-study.yml"]
  workflow_dispatch:
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @report/collector week-study
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          REPORT_BOARD_KEY: ${{ secrets.REPORT_BOARD_KEY }}
