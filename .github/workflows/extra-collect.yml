# 자판기 · 인생네컷 · 주차 자동 수집 — 매일 아침 9시 10분(한국 시간) POS 메인 PC(GitHub 실행기, 라벨 nice-pos)에서
# 나이스 NIBS 통합거래조회로 단말기 4대를 받아 클라우드에 올림. apps/collector/src/extra.ts · 설치 방법은 docs/NICE_RUNNER.md
# 나이스는 해외(GitHub 서버) 접속을 자주 끊어서, 한국에 있는 POS 메인 PC에서 돌림
# 아침 09:10 지난 7일 ~ 어제 (POS 메인 PC는 늦어도 9시 10분에 켜짐 · 밤늦은 결제까지 · 빠진 날 채움) — packages/core/src/extra.ts niceRange
# PC가 아직 안 켜졌으면 실행이 GitHub 에서 기다렸다가 켜지면 돎
# 필요한 값: Secrets NICE_ID · NICE_PW · REPORT_BOARD_KEY · WEATHER_EMAIL · WEATHER_PASSWORD, Variables FIREBASE_API_KEY · FIREBASE_PROJECT_ID
# 엑셀 비밀번호는 실행마다 새로 만들어 쓰고 버림 · 공개 저장소라 기록에는 건수 · 일치 여부만 남김 (매출 숫자 · 가맹점 이름 없음)
name: 자판기 · 네컷 · 주차 자동 수집
on:
  schedule:
    # 지난 7일 ~ 어제 (사람이 올린 칸은 그대로)
    - cron: "10 0 * * *" # 00:10 UTC = 09:10 한국
    # 안 됐으면 10분 뒤 한 번 더 (첫 실행이 성공했으면 건너뜀)
    - cron: "20 0 * * *" # 00:20 UTC = 09:20 한국
  # 작업 브랜치에 올리면 실행기 PC에서 아침 방식(지난 7일 ~ 어제)으로 확인만 (올리지 않음)
  push:
    branches: ["feature/nice-collect"]
    paths: ["apps/collector/**", "packages/core/src/extra.ts", ".github/workflows/extra-collect.yml"]
  workflow_dispatch:
    inputs:
      date:
        description: "시작 날짜 (YYYY-MM-DD, 비우면 어제 ~ 오늘)"
        required: false
      to:
        description: "끝 날짜 (YYYY-MM-DD, 비우면 시작 날짜 하루)"
        required: false
      dry:
        description: "확인만 (올리지 않음)"
        type: boolean
        default: false
      probe:
        description: "막히면 화면 구조 기록 (아이디 · 단추 모양만)"
        type: boolean
        default: false
concurrency:
  group: extra-collect
  cancel-in-progress: false
jobs:
  # 10분 뒤 다시 하는 예약이면: 오늘 아침 예약 실행이 이미 성공했는지 보고, 성공했으면 건너뜀
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      done: ${{ steps.c.outputs.done }}
    steps:
      - id: c
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== "schedule" || context.payload.schedule !== "20 0 * * *") return core.setOutput("done", "");
            const day = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
            const r = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: "extra-collect.yml", event: "schedule", status: "success", created: `>=${day}T00:00:00+09:00` });
            const ok = r.data.workflow_runs.some((x) => x.id !== context.runId);
            core.info(ok ? "오늘 아침 실행이 이미 성공 — 건너뜀" : "오늘 아침 실행이 안 됐거나 실패 — 다시 함");
            core.setOutput("done", ok ? "1" : "");
  collect:
    needs: check
    if: needs.check.outputs.done != '1'
    # POS 메인 PC (Windows) — 실행기를 설치할 때 라벨 nice-pos 를 붙임
    runs-on: [self-hosted, Windows, nice-pos]
    timeout-minutes: 40
    # cmd — PowerShell 은 PC 설정(스크립트 실행 막음)에 따라 안 돌 수 있음
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      # 실행기 도구 폴더에 설치 — 기본값(사용자 폴더)이면 공개 기록에 PC 사용자 이름이 찍힘
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.tool_cache }}\setup-pnpm
      # 받은 꾸러미는 PC(실행기 도구 폴더)에 남으니 GitHub 캐시로 올리지 않음 (올리는 데만 2~3분)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # 크롬은 한 번 받아 두고 다시 씀 (실행기 도구 폴더)
      - run: pnpm --filter @report/collector exec playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}\ms-playwright
      - name: 나이스 → 클라우드
        run: pnpm --filter @report/collector extra
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}\ms-playwright
          # 임시 파일도 실행기 폴더에 (오류 글에 사용자 폴더 이름이 찍히지 않게)
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          # 아침 예약 · 작업 브랜치 시험(push)은 지난 7일 ~ 어제, 손으로 돌리면 어제 ~ 오늘
          NICE_MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && 'morning' || 'manual' }}
          COLLECT_FROM: ${{ inputs.date }}
          COLLECT_TO: ${{ inputs.to }}
          # 작업 브랜치에 올린 시험은 확인만 · 화면 구조 기록
          COLLECT_DRY: ${{ (github.event_name == 'push' || inputs.dry) && '1' || '' }}
          NICE_PROBE: ${{ (github.event_name == 'push' || inputs.probe) && '1' || '' }}
          NICE_ID: ${{ secrets.NICE_ID }}
          NICE_PW: ${{ secrets.NICE_PW }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          REPORT_BOARD_KEY: ${{ secrets.REPORT_BOARD_KEY }}
          WEATHER_EMAIL: ${{ secrets.WEATHER_EMAIL }}
          WEATHER_PASSWORD: ${{ secrets.WEATHER_PASSWORD }}
